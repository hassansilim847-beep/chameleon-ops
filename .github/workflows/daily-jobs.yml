name: chameleon-daily-jobs
on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = ~6-7 Cairo صباحًا
  workflow_dispatch:
    inputs:
      title:
        description: 'Job title'
        default: 'Marketing Manager'
      mode:
        description: 'mena / remote / country'
        default: 'mena'
      rows:
        description: 'rows'
        default: '30'
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests
      - name: Free APIs (Remotive + Jobicy)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python free_apis_jobs.py 2>&1 | tail -40
      - name: Apify LinkedIn MENA
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          T="${{ github.event.inputs.title || 'Marketing Manager' }}"
          M="${{ github.event.inputs.mode || 'mena' }}"
          R="${{ github.event.inputs.rows || '30' }}"
          python apify_jobs.py "$T" "$M" "$R" 2>&1 | tail -60
      - name: Report to Telegram bot
        if: always()
        env:
          BT: ${{ secrets.TELEGRAM_BOT_TOKEN_APPS }}
        run: |
          L=$(python free_apis_jobs.py 'help' 2>/dev/null; true)
          MSG="🦎 دورة الصبح اشتغلت من GitHub Actions — $(date -u) — لو فيه وظائف جديدة هتتسجل في الجود"
          curl -s -X POST "https://api.telegram.org/bot${BT}/sendMessage" -d chat_id=6434711549 -d text="$MSG" || true
